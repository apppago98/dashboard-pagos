<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Pagos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1115;
    --panel: #1A1D22;
    --panel-alt: #20242B;
    --line: #2A2E35;
    --text: #F2F4F6;
    --text-soft: #8B93A1;
    --accent: #5DCAA5;
    --rose: #E07A9A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    padding: 32px 20px 80px;
  }

  .page { max-width: 720px; margin: 0 auto; }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 24px;
  }

  .masthead h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }

  .masthead .subtitle {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-soft);
    margin-top: 4px;
    text-transform: lowercase;
  }

  .masthead .date {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-soft);
    text-align: right;
  }

  .status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-soft);
    margin: 0 0 28px;
    min-height: 14px;
  }

  .status.error { color: var(--rose); }

  .stats-row { display: flex; gap: 10px; margin-bottom: 32px; }

  .stat { flex: 1; background: var(--panel); border-radius: 10px; padding: 16px 18px; }

  .stat-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    text-transform: lowercase;
    color: var(--text-soft);
    margin-bottom: 8px;
  }

  .stat-value { font-size: 22px; font-weight: 600; color: var(--text); }
  .stat-value.accent { color: var(--accent); }

  .section-title { font-size: 14px; font-weight: 500; color: var(--text-soft); margin: 0 0 14px; }

  .chart-wrap { margin-bottom: 36px; padding: 16px 8px 4px; background: var(--panel); border-radius: 10px; }

  #chart { width: 100%; height: 160px; display: block; }

  table { width: 100%; border-collapse: collapse; font-family: 'IBM Plex Mono', monospace; font-size: 12px; }

  thead th {
    text-align: left;
    font-size: 10px;
    text-transform: lowercase;
    color: var(--text-soft);
    font-weight: 400;
    padding: 0 12px 10px;
  }

  thead th.num { text-align: right; }

  tbody tr { background: var(--panel); }
  tbody tr:nth-child(even) { background: var(--panel-alt); }
  tbody td { padding: 11px 12px; }
  tbody tr td:first-child { border-radius: 8px 0 0 8px; }
  tbody tr td:last-child { border-radius: 0 8px 8px 0; }

  td.monto { text-align: right; font-weight: 600; color: var(--accent); white-space: nowrap; }

  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--text-soft);
    font-size: 13px;
    background: var(--panel);
    border-radius: 10px;
    border: 1px dashed var(--line);
  }

  .footer-note {
    margin-top: 32px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--text-soft);
    text-align: center;
  }

  @media (max-width: 480px) {
    .stats-row { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="masthead">
    <div>
      <h1 id="bizName">Registro de pagos</h1>
      <div class="subtitle">confirmación auditiva // bre-b / nequi</div>
    </div>
    <div class="date" id="todayDate"></div>
  </div>

  <div class="status" id="status">Cargando...</div>

  <div class="stats-row">
    <div class="stat">
      <div class="stat-label">total recibido</div>
      <div class="stat-value accent" id="statTotal">$0</div>
    </div>
    <div class="stat">
      <div class="stat-label">transacciones</div>
      <div class="stat-value" id="statCount">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">promedio por pago</div>
      <div class="stat-value" id="statAvg">$0</div>
    </div>
  </div>

  <div class="section-title">últimos 14 días</div>
  <div class="chart-wrap">
    <canvas id="chart"></canvas>
  </div>

  <div class="section-title">detalle de transacciones</div>
  <table id="dataTable" style="display:none">
    <thead>
      <tr>
        <th>fecha</th>
        <th class="num">monto</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div class="empty-state" id="emptyState">Sin datos todavía.</div>

  <div class="footer-note">actualizado automáticamente</div>
</div>

<script>
// ============================================================
// CONFIGURA ESTO UNA SOLA VEZ, con la URL de tu Apps Script
// (la misma que usas en MacroDroid para la Solicitud HTTP)
// ============================================================
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby54gzbUvyL4sFJRw3AvfQdK0UlDmTBD3JUOt2nbllUzcYZsF_NQ1M3vHbpg3sKqTZ6/exec";
// ============================================================

document.getElementById('todayDate').textContent = new Date().toLocaleDateString('es-CO', { day: 'numeric', month: 'long', year: 'numeric' });

const urlParams = new URLSearchParams(window.location.search);
const cliente = urlParams.get('cliente');

if (cliente) {
  document.getElementById('bizName').textContent = 'Registro de pagos — ' + cliente;
}

function formatCOP(n) {
  return '$' + Math.round(n).toLocaleString('es-CO');
}

function drawChart(dailyTotals) {
  const canvas = document.getElementById('chart');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = 160;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  const entries = Object.entries(dailyTotals);
  if (entries.length === 0) {
    ctx.fillStyle = '#8B93A1';
    ctx.font = '11px IBM Plex Mono';
    ctx.fillText('sin datos suficientes para graficar', 10, h / 2);
    return;
  }

  const max = Math.max(...entries.map(e => e[1]), 1);
  const padding = { left: 10, right: 10, top: 10, bottom: 22 };
  const barW = (w - padding.left - padding.right) / entries.length;

  entries.forEach(([date, val], i) => {
    const barH = (val / max) * (h - padding.top - padding.bottom);
    const x = padding.left + i * barW;
    const y = h - padding.bottom - barH;
    ctx.fillStyle = '#5DCAA5';
    ctx.fillRect(x + barW * 0.15, y, barW * 0.7, Math.max(barH, 2));

    ctx.fillStyle = '#8B93A1';
    ctx.font = '9px IBM Plex Mono';
    ctx.textAlign = 'center';
    const label = date.split(' ')[0].split('/').slice(0, 2).join('/');
    ctx.fillText(label, x + barW / 2, h - 6);
  });
}

async function loadData() {
  const statusEl = document.getElementById('status');

  if (!SCRIPT_URL || SCRIPT_URL.indexOf('PEGA_AQUI') !== -1) {
    statusEl.textContent = 'Falta configurar SCRIPT_URL en el código (línea marcada al inicio del script).';
    statusEl.className = 'status error';
    return;
  }
  if (!cliente) {
    statusEl.textContent = 'Falta el parámetro ?cliente= en el link.';
    statusEl.className = 'status error';
    return;
  }

  statusEl.textContent = 'Cargando...';
  statusEl.className = 'status';

  try {
    const res = await fetch(`${SCRIPT_URL}?cliente=${encodeURIComponent(cliente)}`);
    if (!res.ok) throw new Error('No se pudo conectar con el servidor.');
    const parsed = await res.json();

    if (!parsed || parsed.length === 0) {
      document.getElementById('emptyState').style.display = 'block';
      document.getElementById('emptyState').textContent = `Sin pagos registrados todavía para "${cliente}".`;
      document.getElementById('dataTable').style.display = 'none';
      document.getElementById('statTotal').textContent = formatCOP(0);
      document.getElementById('statCount').textContent = '0';
      document.getElementById('statAvg').textContent = formatCOP(0);
      drawChart({});
      statusEl.textContent = '';
      return;
    }

    let total = 0;
    const dailyTotals = {};
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    parsed.forEach(p => {
      total += Number(p.monto) || 0;
      const dayKey = (String(p.fecha).split(' ')[0]) || 'S/F';
      dailyTotals[dayKey] = (dailyTotals[dayKey] || 0) + (Number(p.monto) || 0);
    });

    parsed.slice().reverse().forEach(p => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${p.fecha}</td><td class="monto">${formatCOP(p.monto)}</td>`;
      tbody.appendChild(tr);
    });

    document.getElementById('statTotal').textContent = formatCOP(total);
    document.getElementById('statCount').textContent = parsed.length;
    document.getElementById('statAvg').textContent = formatCOP(total / parsed.length);

    document.getElementById('dataTable').style.display = 'table';
    document.getElementById('emptyState').style.display = 'none';

    const dayEntries = Object.entries(dailyTotals).slice(-14);
    drawChart(Object.fromEntries(dayEntries));

    statusEl.textContent = '';
  } catch (err) {
    statusEl.textContent = err.message || 'Error al conectar.';
    statusEl.className = 'status error';
  }
}

loadData();
setInterval(loadData, 3 * 60 * 1000);
</script>
</body>
</html>
